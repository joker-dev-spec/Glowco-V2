# ------------------------------------------------------------------
# Railway / Nixpacks config (fallback — the Dockerfile takes priority
# and is the recommended path, since it guarantees the mysqli extension).
# ------------------------------------------------------------------
providers = ["php"]

# Nixpacks PHP uses nginx on port 80; Railway injects PORT. Let nginx use it.
variables = { NIXPACKS_PHP_ROOT_DIR = "/app" }

[start]
cmd = "bash start.sh"
